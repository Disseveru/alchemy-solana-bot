[package]
name = "alchemy-solana-bot"
version = "0.1.0"
edition = "2021"
description = "Solana real-time data bot using Yellowstone gRPC (Geyser) interface"
license = "MIT"

[dependencies]
# Yellowstone gRPC Geyser client
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = "12.2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Streaming utilities
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variable loading
dotenvy = "0.15"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"
